[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-research-platform"
version = "0.2.0"
description = "Local A-share quantitative research, audited backtesting and bounded research workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14.0",
    "baostock>=0.8.8",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "duckdb>=0.10.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "tzdata>=2022.7",
    "loguru>=0.7.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "jinja2>=3.1.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
tushare = ["tushare>=1.4.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.4.0"]
notebook = ["jupyter>=1.0.0", "ipykernel>=6.0.0"]
research = ["scikit-learn>=1.4.0", "hmmlearn>=0.3.3,<0.4"]
all = ["a-share-quant-research-platform[tushare,dev,notebook,research]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "compat*"]

[tool.setuptools.package-data]
"src.workbench" = ["web/*.html", "web/*.css", "web/*.js"]
"src.technical" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
