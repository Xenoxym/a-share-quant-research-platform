<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 450" role="img" aria-label="执行系统：研究者写计划，统一入口调度原worker，SQLite记录进度并复用审计">
<style>text{font-family:system-ui,'Microsoft YaHei';fill:#20354f}.t{font-size:20px;font-weight:700}.s{font-size:15px}rect{fill:#f0f6fc;stroke:#88aacf;stroke-width:1.5}.line{fill:none;stroke:#467fb2;stroke-width:2}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#467fb2"/></marker></defs>
<rect x="20" y="25" width="290" height="110" rx="12"/><text x="40" y="60" class="t">研究者写有限计划</text><text x="40" y="88" class="s">问题、提案、依赖、停止条件</text><text x="40" y="113" class="s">复杂研究由Agent思考</text>
<rect x="380" y="25" width="300" height="110" rx="12"/><text x="400" y="60" class="t">统一计划入口</text><text x="400" y="88" class="s">tools/execution.py</text><text x="400" y="113" class="s">登记一次，运行或收取原结果</text>
<rect x="750" y="25" width="290" height="110" rx="12"/><text x="770" y="60" class="t">已有数值worker</text><text x="770" y="88" class="s">公式 / 训练 / 诊断 / 账户</text><text x="770" y="113" class="s">沿用原资源池与冻结协议</text>
<rect x="20" y="255" width="290" height="110" rx="12"/><text x="40" y="290" class="t">按变化做工程复核</text><text x="40" y="318" class="s">测试处理确定性问题</text><text x="40" y="343" class="s">关键改动和收益结论按范围复核</text>
<rect x="380" y="255" width="300" height="110" rx="12"/><text x="400" y="290" class="t">已有SQLite保存进度</text><text x="400" y="318" class="s">实验ID、已用预算、步骤状态</text><text x="400" y="343" class="s">中断不重置，失败不偷偷重跑</text>
<rect x="750" y="255" width="290" height="110" rx="12"/><text x="770" y="290" class="t">审计与文件结果</text><text x="770" y="318" class="s">首次数值核查；不变证据复用</text><text x="770" y="343" class="s">详细日志在文件，默认短状态</text>
<path class="line" d="M310 80H375" marker-end="url(#arr)"/><path class="line" d="M680 80H745" marker-end="url(#arr)"/>
<path class="line" d="M530 138V249" marker-end="url(#arr)"/><path class="line" d="M895 138V249" marker-end="url(#arr)"/><path class="line" d="M745 310H685" marker-end="url(#arr)"/>
<path class="line" d="M375 310H315" marker-end="url(#arr)"/>
<text x="20" y="415" class="s">实际边界：预先准备的提案与实验引用；首版串行。自动生成研究/通用动态DAG尚未实现。</text></svg>