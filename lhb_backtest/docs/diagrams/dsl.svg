<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="DSL：共享基础计算，组合有血缘，合法公式可批量执行"><rect width="1200" height="520" fill="#f7fafc" rx="18" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627285" /></marker></defs><text x="32" y="38" font-size="23" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#15283b">DSL：共享基础计算，组合有血缘，合法公式可批量执行</text><rect x="30" y="90" width="280" height="130" rx="12" fill="#e5f5ec" stroke="#96cfaf" /><text x="46" y="121" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="30,90,280,130">原始可知字段</text><text x="46" y="150" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="30,90,280,130">volume / daily_return</text><text x="46" y="175" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="30,90,280,130">event_net / disclosed_seats</text><rect x="440" y="80" width="290" height="110" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="456" y="111" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="440,80,290,110">公共表达式A</text><text x="456" y="140" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="440,80,290,110">过去20日均量 → 相对量</text><text x="456" y="165" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="440,80,290,110">同日名单内排名</text><rect x="440" y="235" width="290" height="110" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="456" y="266" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="440,235,290,110">公共表达式B</text><text x="456" y="295" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="440,235,290,110">过去5日累计收益</text><text x="456" y="320" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="440,235,290,110">反向排名</text><rect x="870" y="125" width="290" height="130" rx="12" fill="#fff1df" stroke="#e9bf81" /><text x="886" y="156" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="870,125,290,130">候选1：A × B</text><text x="886" y="185" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="870,125,290,130">价量条件关系</text><text x="886" y="210" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="870,125,290,130">另行定义目标持仓</text><rect x="870" y="305" width="290" height="120" rx="12" fill="#fff1df" stroke="#e9bf81" /><text x="886" y="336" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="870,305,290,120">候选2：事件 × A</text><text x="886" y="365" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="870,305,290,120">事件结构和相对活跃度</text><text x="886" y="390" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="870,305,290,120">A复用缓存，不重复算</text><path d="M 310 140 L 435 135" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 310 185 L 435 287" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 730 135 L 865 160" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 730 287 L 865 223" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 730 145 L 865 350" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="32" y="470" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#526b7d">AST身份 = 公式 + 输入快照 + 时点规则 + 名单 + 算子版本；未知字段/未来运算/非法定义域拒绝。</text></svg>