<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="增量建设：已有底座继续用，新增研究包承担扩展"><rect width="1200" height="560" fill="#f7fafc" rx="18" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627285" /></marker></defs><text x="32" y="38" font-size="23" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#15283b">增量建设：已有底座继续用，新增研究包承担扩展</text><rect x="35" y="85" width="335" height="145" rx="12" fill="#e5f5ec" stroke="#96cfaf" /><text x="51" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="35,85,335,145">现有 technical</text><text x="51" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="35,85,335,145">Market / simulate / 权益会计</text><text x="51" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="35,85,335,145">外部目标持仓 prepared 接口</text><text x="51" y="195" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="35,85,335,145">账户核查 tools/verify_technical</text><rect x="435" y="85" width="335" height="145" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="451" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="435,85,335,145">新增 alpharesearch</text><text x="451" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="435,85,335,145">事件与时点 / 特征 / DSL</text><text x="451" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="435,85,335,145">数据表示 / 模型 / 数值批次</text><text x="451" y="195" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="435,85,335,145">筛选与目标组合桥接</text><rect x="835" y="85" width="335" height="145" rx="12" fill="#e5f5ec" stroke="#96cfaf" /><text x="851" y="116" font-size="20" font-weight="700" font-