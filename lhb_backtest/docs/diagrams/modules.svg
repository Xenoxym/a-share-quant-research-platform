i, sans-serif" fill="#354b61" data-box="835,335,335,120">依赖版本与资源验收</text><path d="M 435 158 L 375 158" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 835 158 L 775 158" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 600 230 L 600 330" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="517" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#526b7d">先P0解除日历故障、P1接事件与宽特征，再扩DSL和并行；不以大规模重写替代验收。</text></svg>