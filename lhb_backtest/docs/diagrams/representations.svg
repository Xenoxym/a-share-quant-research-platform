<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-label="同一批历史事实，可以构造成不同模型适合的输入"><rect width="1200" height="570" fill="#f7fafc" rx="18" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627285" /></marker></defs><text x="32" y="38" font-size="23" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#15283b">同一批历史事实，可以构造成不同模型适合的输入</text><rect x="32" y="85" width="340" height="145" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="48" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="32,85,340,145">汇总表格</text><text x="48" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,85,340,145">1只股票 × 1决策日 × D列</text><text x="48" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,85,340,145">线性 / 树 / MLP</text><rect x="430" y="85" width="340" height="145" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="446" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="430,85,340,145">过去时间序列</text><text x="446" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,85,340,145">1只股票 × 60日 × 20维</text><text x="446" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,85,340,145">GRU / LSTM / TCN</text><rect x="828" y="85" width="340" height="145" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="844" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="828,85,340,145">稀疏事件序列</text><text x="844" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,85,340,145">最近5次已知事件 + 日龄</text><text x="844" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,85,340,145">事件编码与普通日线合并</text><rect x="32" y="290" width="340" height="145" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="48" y="321" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="32,290,340,145">同日截面集合</text><text x="48" y="350" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,290,340,145">N只股票 × D维</text><text x="48" y="375" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,290,340,145">截面注意力 / 条件模型</text><rect x="430" y="290" width="340" height="145" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="446" y="321" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="430,290,340,145">当时披露关系图</text><text x="446" y="350" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,290,340,145">股票节点 ↔ 具名席位节点</text><text x="446" y="375" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,290,340,145">关系网络 / GNN</text><rect x="828" y="290" width="340" height="145" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="844" y="321" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="828,290,340,145">多路输入</text><text x="844" y="350" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,290,340,145">日线 + 事件 + 财务 + 市场</text><text x="844" y="375" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,290,340,145">单路、合并、打乱消融</text><text x="32" y="510" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#526b7d">所有输入只到评分截止；停牌与缺失掩码保留；重叠窗口不等于增加独立样本。</text></svg>