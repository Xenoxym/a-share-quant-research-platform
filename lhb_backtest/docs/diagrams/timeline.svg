<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 365" role="img" aria-label="事件时点：发生、公布、评分、成交不是同一个时间"><rect width="1200" height="365" fill="#f7fafc" rx="18" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627285" /></marker></defs><text x="32" y="38" font-size="23" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#15283b">事件时点：发生、公布、评分、成交不是同一个时间</text><rect x="24" y="85" width="216" height="158" rx="12" fill="#e5f5ec" stroke="#96cfaf" /><text x="40" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="24,85,216,158">交易日T收盘</text><text x="40" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="24,85,216,158">当天价量已形成</text><text x="40" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="24,85,216,158">报告尚不能假定已可知</text><path d="M 240 162 L 258 162" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="262" y="85" width="216" height="158" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="278" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="262,85,216,158">报告进入数据</text><text x="278" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="262,85,216,158">保留报告日与窗口</text><text x="278" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="262,85,216,158">实际时分可能没有记录</text><path d="M 478 162 L 496 162" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="500" y="85" width="216" height="158" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="516" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="500,85,216,158">可用性策略</text><text x="516" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="500,85,216,158">采用实测时刻或</text><text x="516" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="500,85,216,158">事前声明延迟假设</text><path d="M 716 162 L 734 162" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="738" y="85" width="216" height="158" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="754" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="738,85,216,158">评分截止</text><text x="754" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="738,85,216,158">只关联截止前可用内容</text><text x="754" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="738,85,216,158">无事件与缺失分别编码</text><path d="M 954 162 L 972 162" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="976" y="85" width="216" height="158" rx="12" fill="#fff1df" stroke="#e9bf81" /><text x="992" y="116" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="976,85,216,158">后续执行开盘</text><text x="992" y="145" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="976,85,216,158">Y从定义的买入端点开始</text><text x="992" y="170" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="976,85,216,158">下一执行端点结束</text><text x="30" y="286" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#526b7d">无发布时分时：例如先完整延迟一个市场日，再评分/执行；假设必须披露并做敏感性。</text><text x="30" y="319" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#526b7d">禁止：把交易日T的龙虎榜数据直接套上T日15:30“已知”，或以未来能否买到删除股票。</text></svg>