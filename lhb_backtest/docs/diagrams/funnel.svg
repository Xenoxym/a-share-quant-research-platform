ow)" /><rect x="255.0" y="345" width="690" height="77" rx="12" fill="#fff1df" stroke="#e9bf81" /><text x="271.0" y="376" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="255.0,345,690,77">S3 8–12个原生账户配置</text><text x="271.0" y="405" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="255.0,345,690,77">两种费用路径，真正的账户收益/回撤</text><path d="M 600 422 L 600 432" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="315.0" y="436" width="570" height="77" rx="12" fill="#fff1df" stroke="#e9bf81" /><text x="331.0" y="467" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="315.0,436,570,77">S4 复核与稳健性</text><text x="331.0" y="496" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="315.0,436,570,77">全部尝试、年份、暴露、选择不确定性</text><text x="55" y="562" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#526b7d">所有淘汰与失败进入账本；IC不是唯一通道；最终成果通知只依据核查后的账户。</text></svg>