<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" role="img" aria-label="Codex工程交付：小增量、可信检查、明确接续"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60748c"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f9fc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173652}</style><text x="32" y="52" font-size="28" font-weight="700">Codex工程交付：小增量、可信检查、明确接续</text><path d="M330 166L375 166" stroke="#60748c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M680 166L725 166" stroke="#60748c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M880 235L880 280" stroke="#60748c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M730 355L685 355" stroke="#60748c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M380 355L335 355" stroke="#60748c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1030 166L1075 166" stroke="#60748c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="100" width="300" height="135" rx="14" fill="#e2f2eb" stroke="#aec2d7"/><text data-box="30,100,300,135" x="48" y="133" font-size="21" font-weight="700">1 主控固定工作包</text><text data-box="30,100,300,135" x="48" y="165" font-size="18">目标、范围、依赖、反例</text><text data-box="30,100,300,135" x="48" y="192" font-size="18">真实基线与有界预算</text><rect x="380" y="100" width="300" height="135" rx="14" fill="#e7efff" stroke="#aec2d7"/><text data-box="380,100,300,135" x="398" y="133" font-size="21" font-weight="700">2 实施者隔离修改</text><text data-box="380,100,300,135" x="398" y="165" font-size="18">拥有文件、相关检查</text><text data-box="380,100,300,135" x="398" y="192" font-size="18">保留失败和源码哈希</text><rect x="730" y="100" width="300" height="135" rx="14" fill="#e7efff" stroke="#aec2d7"/><text data-box="730,100,300,135" x="748" y="133" font-size="21" font-weight="700">3 冻结审查对象</text><text data-box="730,100,300,135" x="748" y="165" font-size="18">commit / diff / evidence</text><text data-box="730,100,300,135" x="748" y="192" font-size="18">双复核只读，独立上下文</text><rect x="730" y="285" width="300" height="140" rx="14" fill="#fff0dc" stroke="#aec2d7"/><text data-box="730,285,300,140" x="748" y="318" font-size="21" font-weight="700">4 方法与工程复核</text><text data-box="730,285,300,140" x="748" y="350" font-size="18">时间、数据、接口、恢复</text><text data-box="730,285,300,140" x="748" y="377" font-size="18">确定性检查补充AI判断</text><rect x="380" y="285" width="300" height="140" rx="14" fill="#fff0dc" stroke="#aec2d7"/><text data-box="380,285,300,140" x="398" y="318" font-size="21" font-weight="700">5 修复并集成</text><text data-box="380,285,300,140" x="398" y="350" font-size="18">阻断解决，合并状态检查</text><text data-box="380,285,300,140" x="398" y="377" font-size="18">新差异重新冻结与核查</text><rect x="30" y="285" width="300" height="140" rx="14" fill="#e2f2eb" stroke="#aec2d7"/><text data-box="30,285,300,140" x="48" y="318" font-size="21" font-weight="700">6 GitHub交付准备</text><text data-box="30,285,300,140" x="48" y="350" font-size="18">文件清单、安装、CI、PR</text><text data-box="30,285,300,140" x="48" y="377" font-size="18">已知目标和授权后更新</text><rect x="1080" y="100" width="320" height="325" rx="14" fill="#edf4fb" stroke="#aec2d7"/><text data-box="1080,100,320,325" x="1098" y="133" font-size="21" font-weight="700">共享状态与下一阶段</text><text data-box="1080,100,320,325" x="1098" y="165" font-size="18">任务库与领取凭据</text><text data-box="1080,100,320,325" x="1098" y="192" font-size="18">快照、实验、全部尝试</text><text data-box="1080,100,320,325" x="1098" y="219" font-size="18">阶段总结和交接</text><text data-box="1080,100,320,325" x="1098" y="246" font-size="18">用户目标与研究覆盖</text><text data-box="1080,100,320,325" x="1098" y="273" font-size="18">收益/回撤最终验收</text></svg>