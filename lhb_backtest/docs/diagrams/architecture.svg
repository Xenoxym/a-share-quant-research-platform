<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-label="总体设计：宽信息 → 特征与模型 → 账户 → 研究反馈"><rect width="1200" height="650" fill="#f7fafc" rx="18" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627285" /></marker></defs><text x="32" y="38" font-size="23" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#15283b">总体设计：宽信息 → 特征与模型 → 账户 → 研究反馈</text><rect x="32" y="75" width="340" height="135" rx="12" fill="#e5f5ec" stroke="#96cfaf" /><text x="48" y="106" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="32,75,340,135">1 数据快照</text><text x="48" y="135" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,75,340,135">日线 / 财务 / 龙虎榜 / 席位</text><text x="48" y="160" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,75,340,135">复用原行情，新增事件快照</text><rect x="430" y="75" width="340" height="135" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="446" y="106" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="430,75,340,135">2 信息可用性</text><text x="446" y="135" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,75,340,135">时点 / 报告窗口 / 单位 / 缺失</text><text x="446" y="160" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,75,340,135">数据日期不等于可用时间</text><rect x="828" y="75" width="340" height="135" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="844" y="106" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="828,75,340,135">3 特征与表示</text><text x="844" y="135" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,75,340,135">板型 / 披露结构 / 相对状态</text><text x="844" y="160" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,75,340,135">汇总、序列、事件与关系</text><rect x="828" y="250" width="340" height="135" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="844" y="281" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="828,250,340,135">4 候选与数值批次</text><text x="844" y="310" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,250,340,135">人工、模板、公式、GP / RL</text><text x="844" y="335" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,250,340,135">分批、去重、预算与缓存</text><rect x="430" y="250" width="340" height="135" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="446" y="281" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="430,250,340,135">5 模型学习</text><text x="446" y="310" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,250,340,135">线性 / 随机森林 / 树 / 神经网络</text><text x="446" y="335" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,250,340,135">固定X比模型，固定模型比X</text><rect x="32" y="250" width="340" height="135" rx="12" fill="#e8f0ff" stroke="#a8bfe8" /><text x="48" y="281" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="32,250,340,135">6 目标组合</text><text x="48" y="310" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,250,340,135">纯ML / 事件机会 / 小市值增强</text><text x="48" y="335" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,250,340,135">权重、留仓与风险约束</text><rect x="32" y="425" width="340" height="135" rx="12" fill="#e5f5ec" stroke="#96cfaf" /><text x="48" y="456" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="32,425,340,135">7 原生账户</text><text x="48" y="485" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,425,340,135">统一成交、现金、权益与费用</text><text x="48" y="510" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="32,425,340,135">共同规则下的每日资金路径</text><rect x="430" y="425" width="340" height="135" rx="12" fill="#fff1df" stroke="#e9bf81" /><text x="446" y="456" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="430,425,340,135">8 验收与复核</text><text x="446" y="485" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,425,340,135">收益 / 回撤 / 分年 / 不确定性</text><text x="446" y="510" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="430,425,340,135">IC仅诊断；失败保留</text><rect x="828" y="425" width="340" height="135" rx="12" fill="#fff1df" stroke="#e9bf81" /><text x="844" y="456" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif" fill="#183049" data-box="828,425,340,135">9 主题记忆与下一批</text><text x="844" y="485" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,425,340,135">覆盖地图 / 反例 / 新假设</text><text x="844" y="510" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#354b61" data-box="828,425,340,135">按机制接续，避免只调模型</text><path d="M 372 142 L 426 142" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 770 142 L 824 142" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 998 210 L 998 246" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 828 317 L 774 317" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 430 317 L 376 317" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 202 385 L 202 421" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 372 492 L 426 492" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M 770 492 L 824 492" stroke="#627285" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="34" y="610" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#526b7d">贯穿各层：正式登记 · 全部候选账本 · 源码/数据哈希 · 因果核查 · 有界资源与恢复</text></svg>