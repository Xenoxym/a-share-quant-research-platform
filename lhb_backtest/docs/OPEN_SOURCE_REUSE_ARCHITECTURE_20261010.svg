<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">现有专用研究层与候选外部后端</title><desc id="desc">现有时点正确的数据和独立资金核查保持；外部研究和生成后端尚未接入。实线表示现有功能，蓝色虚线表示拟议后端。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#63798c"/></marker></defs><rect width="1120" height="760" fill="#fff"/><text x="560" y="35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" fill="#21384b" text-anchor="middle">建议的复用架构：外部候选均未接入</text><text x="560" y="65" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#21384b" text-anchor="middle">简化图：自己的数据 → 可替换研究工具 → 自己的资金评价</text><rect x="30" y="91" width="285" height="78" rx="10" fill="#e9f5ee" stroke="#4c8764" stroke-width="2"/><text x="172.5" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">已有数据与时间约束</text><text x="172.5" y="146" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">真实公开时间、名单、成熟Y</text><rect x="415" y="91" width="285" height="78" rx="10" fill="#eef5fc" stroke="#4d85b4" stroke-width="2" stroke-dasharray="8 5"/><text x="557.5" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">研究工具（候选）</text><text x="557.5" y="146" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">Qlib 或 vnpy.alpha</text><rect x="800" y="91" width="285" height="78" rx="10" fill="#e9f5ee" stroke="#4c8764" stroke-width="2"/><text x="942.5" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">已有账户与独立核查</text><text x="942.5" y="146" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">统一收益、回撤与对照</text><path d="M315,130 L415,130" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M700,130 L800,130" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="560" y="227" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" fill="#21384b" text-anchor="middle">展开图：生成、计算、模型和账户分别比较</text><rect x="355" y="266" width="395" height="83" rx="10" fill="#e9f5ee" stroke="#4c8764" stroke-width="2"/><text x="552.5" y="295" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">已有数据与研究约束</text><text x="552.5" y="321" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">行情 / 财报 / 龙虎榜 / 连板</text><text x="552.5" y="347" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">真实交易日历、缺失、信息可见时间</text><rect x="35" y="383" width="270" height="109" rx="10" fill="#eef5fc" stroke="#4d85b4" stroke-width="2" stroke-dasharray="8 5"/><text x="170.0" y="412" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">生成候选（待接入）</text><text x="170.0" y="438" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">人工公式（已有）</text><text x="170.0" y="464" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">AlphaGen / RD-Agent（候选）</text><text x="170.0" y="490" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">只接研究反馈，保留尝试总账</text><rect x="355" y="385" width="395" height="109" rx="10" fill="#eef5fc" stroke="#4d85b4" stroke-width="2" stroke-dasharray="8 5"/><text x="552.5" y="414" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">数据 / 模型适配（未实现）</text><text x="552.5" y="440" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">同X、同成熟Y、同名单</text><text x="552.5" y="466" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">Qlib 或 vnpy.alpha</text><text x="552.5" y="492" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">先验证，再选一个主干</text><rect x="810" y="383" width="275" height="109" rx="10" fill="#eef5fc" stroke="#4d85b4" stroke-width="2" stroke-dasharray="8 5"/><text x="947.5" y="412" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">快速筛选（外部待比较）</text><text x="947.5" y="438" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">已有筛选器</text><text x="947.5" y="464" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">vectorbt / 编译后端</text><text x="947.5" y="490" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">代理评价须再进资金账户</text><path d="M552,349 L552,385" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M305,438 L355,438" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M750,438 L810,438" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="355" y="532" width="395" height="83" rx="10" fill="#e9f5ee" stroke="#4c8764" stroke-width="2"/><text x="552.5" y="561" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">已有分数 → 目标权重 → 主板账户</text><text x="552.5" y="587" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">保留同费用、T+与权益口径</text><text x="552.5" y="613" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">独立验算及共同收益 / 回撤定义</text><path d="M552,494 L552,532" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)"/><path d="M947,492 L947,574" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M947,574 L750,574" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="639" width="300" height="77" rx="10" fill="#eef5fc" stroke="#4d85b4" stroke-width="2" stroke-dasharray="8 5"/><text x="185.0" y="668" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">账户交叉核对（待评估）</text><text x="185.0" y="694" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">RQAlpha等；授权和语义待核对</text><rect x="810" y="639" width="275" height="77" rx="10" fill="#eef5fc" stroke="#4d85b4" stroke-width="2" stroke-dasharray="8 5"/><text x="947.5" y="668" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#21384b" text-anchor="middle">执行扩展（候选）</text><text x="947.5" y="694" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#21384b" text-anchor="middle">Nautilus / WonderTrader</text><path d="M355,575 L185,639" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M750,575 L947,639" fill="none" stroke="#63798c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="560" y="742" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#21384b" text-anchor="middle">绿框：已有功能；蓝虚线：提案 / 候选。并不要求把所有框架同时安装。</text></svg>
