<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 970" role="img" aria-labelledby="label-detail"><title id="label-detail">当前有用模块的功能架构</title><style>.title{font:600 23px system-ui,Arial,sans-serif;fill:#173b57}.sub{font:19px system-ui,Arial,sans-serif;fill:#405567}</style><defs><marker id="arrow-detail" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#49779b"/></marker></defs><rect width="100%" height="100%" fill="#f4f8fb"/><rect x="26" y="36" width="650" height="146" rx="14" fill="#ffffff" stroke="#a7c7df"/><text x="50" y="69" class="title">数据来源与冻结</text><text x="50" y="101" class="sub">日线行情、交易日历、历史状态与公司行动</text><text x="50" y="130" class="sub">龙虎榜原报告 / 席位；财报与公告股本</text><text x="50" y="159" class="sub">保存快照、覆盖范围和信息可用时间</text><path d="M350 183 V208" stroke="#49779b" stroke-width="2" marker-end="url(#arrow-detail)"/><rect x="26" y="214" width="650" height="146" rx="14" fill="#ffffff" stroke="#a7c7df"/><text x="50" y="247" class="title">信息加工与候选</text><text x="50" y="279" class="sub">价量16项；板型29项；龙虎榜、财务、市场</text><text x="50" y="308" class="sub">特征字典、统一组装；日历序列及缺失掩码</text><text x="50" y="337" class="sub">受限组合公式、计算算子、共享缓存、快速初筛</text><path d="M350 361 V386" stroke="#49779b" stroke-width="2" marker-end="url(#arrow-detail)"/><rect x="26" y="392" width="650" height="146" rx="14" fill="#ffffff" stroke="#a7c7df"/><text x="50" y="425" class="title">学习与预测</text><text x="50" y="457" class="sub">六类表格模型；按时间划分训练和预测</text><text x="50" y="486" class="sub">只使用已成熟标签；预处理仅学习训练数据</text><text x="50" y="515" class="sub">目标变换仍是独立接口；实际模型与训练输入存档已验收</text><path d="M350 539 V564" stroke="#49779b" stroke-width="2" marker-end="url(#arrow-detail)"/><rect x="26" y="570" width="650" height="146" rx="14" fill="#ffffff" stroke="#a7c7df"/><text x="50" y="603" class="title">组合与资金账户</text><text x="50" y="635" class="sub">当时资格、分数排序、持仓数量、权重与调仓</text><text x="50" y="664" class="sub">原资金引擎：订单、现金、持股、权益事件</text><text x="50" y="693" class="sub">零费与配置费分开运行；收益 / 回撤 / 仓位 / 换手</text><path d="M350 717 V742" stroke="#49779b" stroke-width="2" marker-end="url(#arrow-detail)"/><rect x="26" y="748" width="650" height="146" rx="14" fill="#ffffff" stroke="#a7c7df"/><text x="50" y="781" class="title">独立核查与展示</text><text x="50" y="813" class="sub">重新生成选择名单，逐日检查现金与资产算数</text><text x="50" y="842" class="sub">不认证供应商历史，也不重新拟合模型分数</text><text x="50" y="871" class="sub">原工作台展示任务、账户、订单与诊断结果</text><rect x="700" y="36" width="254" height="858" rx="14" fill="#eaf3f9" stroke="#a7c7df"/><text x="724" y="76" class="title">贯穿全流程的支持</text><text x="724" y="152" class="sub">任务与共享进度</text><text x="724" y="228" class="sub">事前登记 / 固定预算</text><text x="724" y="304" class="sub">保存数据和代码版本</text><text x="724" y="380" class="sub">有限进程与资源监督</text><text x="724" y="456" class="sub">失败 / 取消全部保留</text><text x="724" y="532" class="sub">原结果收取与恢复</text><text x="724" y="608" class="sub">本机研究证据留档</text><text x="724" y="684" class="sub">两名只读复核</text><text x="724" y="760" class="sub">选择性GitHub发布</text></svg>
