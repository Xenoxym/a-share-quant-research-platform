<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">长期研究范围、阶段验证与知识更新闭环</title>
  <desc id="desc">长期目标及外部知识发现进入研究雷达，由有限任务依次经过信息与时间契约、特征模型组合、账户与统计核查和独立复核。阶段结果更新雷达并决定下一轮。原生证据保留失败。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#58738c"/></marker></defs>
  <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#142d42}.h{font-size:23px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#4d6478}.box{fill:#fff;stroke:#bdd1df;stroke-width:2;rx:14}.line{fill:none;stroke:#58738c;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1120" height="660" rx="20" fill="#f1f6fa"/>
  <text x="38" y="43" class="h">范围开放，任务有限，证据完整，下一轮有理由</text>
  <rect class="box" x="35" y="80" width="320" height="110"/>
  <text x="56" y="113" class="h">长期目标与外部探索</text><text x="56" y="144" class="b">用户目标 + 主动发现 + 反方证据</text><text x="56" y="170" class="s">不断扩充认知，不以当前工具划边界</text>
  <rect class="box" x="400" y="80" width="320" height="110"/>
  <text x="421" y="113" class="h">研究雷达与有限任务</text><text x="421" y="144" class="b">竞争方向 → 选择理由 → 登记预算</text><text x="421" y="170" class="s">核对旧尝试，先设否证和停止条件</text>
  <rect class="box" x="765" y="80" width="320" height="110"/>
  <text x="786" y="113" class="h">数据与时间契约</text><text x="786" y="144" class="b">来源、快照、当时可见信息、Y</text><text x="786" y="170" class="s">缺数据或工程失败必须明确记录</text>
  <path class="line" d="M355 135 H396"/><path class="line" d="M720 135 H761"/>
  <rect class="box" x="765" y="270" width="320" height="120"/>
  <text x="786" y="305" class="h">特征、表示、学习与组合</text><text x="786" y="337" class="b">手工 / 自动发现 / 多模型 / 权重</text><text x="786" y="365" class="s">逐层筛选；预测指标提供诊断</text>
  <rect class="box" x="400" y="270" width="320" height="120"/>
  <text x="421" y="305" class="h">账户与统计核查</text><text x="421" y="337" class="b">收益、回撤、敞口、对照、稳定性</text><text x="421" y="365" class="s">历史使用与选择偏差不可被清零</text>
  <rect class="box" x="35" y="270" width="320" height="120"/>
  <text x="56" y="305" class="h">复核、结论与下一轮</text><text x="56" y="337" class="b">两名独立复核 → 裁决 → 阶段交接</text><text x="56" y="365" class="s">重要成果报告附此前研究路径</text>
  <path class="line" d="M925 190 V266"/><path class="line" d="M765 330 H724"/><path class="line" d="M400 330 H359"/>
  <path class="line" d="M195 270 V225 H560 V194"/>
  <text x="233" y="218" class="s">结果更新地图；覆盖审查决定下一轮</text>
  <rect x="35" y="475" width="1050" height="140" rx="15" fill="#e5eef5"/>
  <text x="58" y="509" class="h">共享记忆与可复现基础</text>
  <text x="58" y="544" class="b">AGENTS / Worker 入口 · 稳定纲领 · 可更新雷达 · 任务父子关系 · 冻结输入代码 · 全部尝试与失败</text>
  <text x="58" y="578" class="s">图示为长期架构与工作流程；各节点的实际能力以任务、代码、运行收据和核查结果为准。</text>
</svg>
