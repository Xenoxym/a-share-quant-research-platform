name: Software checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lhb_backtest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUTF8: '1'
    steps:
      # Official release commit links are recorded in docs/PUBLIC_DELIVERY.md.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[research,dev]"
      - run: python -m pytest -q --basetemp ../.qa_ci
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir ../dist
      - run: python tools/technical_research.py template
